# ---------------------------------------------------------------------------
# Task 4 — NGINX reverse proxy for the devlogin Node.js app.
#
# Installed to /etc/nginx/sites-available/devlogin.conf by 04-install-nginx.sh.
# Certbot rewrites the TLS block in place when it issues the certificate.
#
# Placeholders substituted at install time:
#   __DOMAIN__     -> devlogin.nextastra.com
#   __APP_HOST__   -> 127.0.0.1
#   __APP_PORT__   -> 3000
# ---------------------------------------------------------------------------

# Named upstream: lets us add more app instances later without touching the
# proxy_pass lines, and gives us keepalive connections to the Node process.
upstream devlogin_app {
    server __APP_HOST__:__APP_PORT__ max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Rate limit zones. Login is far stricter than general browsing.
limit_req_zone $binary_remote_addr zone=devlogin_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=devlogin_login:10m   rate=5r/m;
limit_conn_zone $binary_remote_addr zone=devlogin_conn:10m;

# --- Port 80: ACME challenges, everything else redirects to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 challenge. Must stay on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443: the application --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # ---- TLS (certbot replaces these paths with the issued certificate) ---
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling: the client checks revocation without a round trip to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers -------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Do not advertise the NGINX version.
    server_tokens off;

    # ---- Limits -----------------------------------------------------------
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    limit_conn devlogin_conn 20;

    # ---- Logging ----------------------------------------------------------
    access_log /var/log/nginx/devlogin.access.log combined;
    error_log  /var/log/nginx/devlogin.error.log warn;

    # ---- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # ---- Shared proxy settings -------------------------------------------
    # Repeated per-location because add_header/proxy_set_header do not inherit
    # into a location that defines its own.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_buffering on;

    # ---- Login: strict rate limit ----------------------------------------
    location = /api/login {
        # 5 requests/minute, allowing a burst of 5 before rejecting.
        limit_req zone=devlogin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://devlogin_app;
    }

    # ---- Metrics: never expose publicly ----------------------------------
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # docker bridge, where Prometheus runs
        deny all;

        access_log off;
        proxy_pass http://devlogin_app;
    }

    # ---- Health checks: allowed, but kept out of the access log ----------
    location ~ ^/(healthz|readyz)$ {
        access_log off;
        proxy_pass http://devlogin_app;
    }

    # ---- Everything else --------------------------------------------------
    location / {
        limit_req zone=devlogin_general burst=50 nodelay;
        proxy_pass http://devlogin_app;
    }

    # Friendly error page when the Node process is down mid-deploy.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/devlogin-errors;
        internal;
    }
}
