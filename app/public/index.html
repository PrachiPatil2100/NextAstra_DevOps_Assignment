<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRUD App — Sign in</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="centered">
  <main class="card">
    <h1>CRUD App</h1>
    <p class="sub">Node.js CRUD demo · CI/CD assignment</p>

    <form id="form" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <button type="submit" id="submit" class="wide">Sign in</button>
    </form>

    <div id="msg" role="status" aria-live="polite"></div>

    <footer>
      Build <code id="build">…</code> · commit <code id="commit">…</code><br />
      Health: <code>/healthz</code> · Metrics: <code>/metrics</code>
    </footer>
  </main>

<!-- External file, not inline: the CSP sets script-src 'self'. -->
<script src="/app.js" defer></script>
</body>
</html>
